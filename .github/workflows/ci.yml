name: Calibrated adapter integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  calibrated-investigation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - name: Exercise pinned RCI and FSRT with offline replay and refusal gates
        run: python scripts/check_adapters.py
