name: Calibrated adapter integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  calibrated-investigation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Route provider clones through the read token when one is configured
        uses: ./.github/actions/provider-read-token
        with:
          token: ${{ secrets.PROVIDER_READ_TOKEN }}
      - run: python -m pip install -e ".[dev]"
      - name: Exercise pinned RCI, FSRT and GTE with offline replay and refusal gates
        run: python scripts/check_adapters.py
