name: Acquired calibrated stream and residual monitor

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  acquired-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Route provider clones through the read token when one is configured
        uses: ./.github/actions/provider-read-token
        with:
          token: ${{ secrets.PROVIDER_READ_TOKEN }}
      - run: python -m pip install 'setuptools>=77' wheel
      - name: Exercise isolated installed workbench with exact native providers
        run: python scripts/check_acquired_stream.py --output-dir results/acquired-stream
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: acquired-stream-native-replay
          path: results/acquired-stream
