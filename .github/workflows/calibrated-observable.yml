name: Calibrated observable process replay

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  process-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Verify pinned calibration, alignment, observability and residual path
        run: python scripts/check_calibrated_observable.py
