name: Native geometry providers

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  geometry:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'setuptools>=77' wheel
      - run: python scripts/check_geometry_research.py --output-dir results/geometry-research
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: geometry-provider-evidence-${{ matrix.os }}
          path: results/geometry-research
