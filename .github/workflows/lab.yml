name: Computational experimentalist queue

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'setuptools>=77' wheel
      - name: Clean-room queue with pinned CSG, FTR and PLSR; verify retained reports
        run: python scripts/check_lab.py --output-dir results/lab-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-evidence
          path: results/lab-gate
          if-no-files-found: warn
