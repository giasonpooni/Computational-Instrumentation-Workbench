name: Computational experimentalist queue

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'setuptools>=77' wheel
      - name: Install the Rust toolchain the proved-heat gate pins (T099 rebuilds execution-cli with it)
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Provision Julia 1.10.12 LTS and T145's worker environment (official archive and checksum, instantiate, precompile)
        run: python scripts/provision_julia.py --prefix "$RUNNER_TEMP/julia" --depot "$RUNNER_TEMP/julia-depot"
      - name: Clean-room queue with pinned CSG, FTR and PLSR; verify retained reports
        run: >-
          python scripts/check_lab.py --output-dir results/lab-gate
          --julia "$RUNNER_TEMP/julia/julia-1.10.12/bin/julia" --julia-depot "$RUNNER_TEMP/julia-depot"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-evidence
          path: results/lab-gate
          if-no-files-found: warn
