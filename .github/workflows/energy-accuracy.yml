name: Retained energy-to-accuracy bench

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  energy-accuracy:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'setuptools>=77' wheel
      - run: python scripts/check_energy.py --output-dir results/energy-accuracy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: energy-accuracy-evidence-${{ matrix.os }}
          path: results/energy-accuracy
          if-no-files-found: warn
