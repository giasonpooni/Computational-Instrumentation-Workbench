name: Model core and pinned Julia worker

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  model-core:
    # Linux x86-64 is the only platform with pinned Julia runtime digests.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'setuptools>=77' 'packaging>=24.2' wheel
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended
      - run: python scripts/check_model_core.py --output-dir results/model-core
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: model-core-evidence
          path: results/model-core
