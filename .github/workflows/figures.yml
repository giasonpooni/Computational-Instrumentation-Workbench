name: Second-platform figure comparison

# T158 re-executes the figure tasks that fit its time budget on the platform of the retained run; this job
# re-executes every retained figure task on Windows and compares each figure with the retained copy
# (scripts/check_figures.py). Tasks whose retained reports used a provider not bound here are listed as not
# re-executed, never counted as matches.
on:
  push:
    paths:
      - 'lab/**'
      - 'src/ciw/lab/**'
      - 'scripts/check_figures.py'
      - '.github/workflows/figures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  figures:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,lab]"
      - name: Re-execute every retained figure task and compare
        run: python scripts/check_figures.py --retained lab --output-dir results/figures-windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: figure-check-windows
          path: |
            results/figures-windows/figure-check.json
            results/figures-windows/figure-check.md
          if-no-files-found: error
