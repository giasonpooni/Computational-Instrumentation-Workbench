name: Pinned telemetry replay

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Route provider clones through the read token when one is configured
        uses: ./.github/actions/provider-read-token
        with:
          token: ${{ secrets.PROVIDER_READ_TOKEN }}
      - run: python -m pip install -e ".[dev]"
      - name: Recompute pinned PPDA, STFE, GSIE, SET and optional CBSR
        run: python scripts/check_telemetry.py
