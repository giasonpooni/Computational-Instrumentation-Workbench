name: Shared schematic and numerical workloads

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  declared-workloads:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
      - run: python -m pip install 'setuptools>=77' wheel
      - name: Exercise installed workbench with pinned SRA and native Rust SCR
        run: python scripts/check_declared_workloads.py --output-dir results/declared-workloads
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: declared-workload-native-replay
          path: results/declared-workloads
