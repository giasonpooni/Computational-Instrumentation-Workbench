name: Prototype checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  lab-blas-kernels:
    # Retained lab evidence must regenerate on any OpenBLAS kernel a host picks: run the lab tests on an AVX2 kernel
    # and on a kernel without FMA, forced through OPENBLAS_CORETYPE and confirmed from the loaded library, then
    # re-execute every retained figure task there: only a figure its task declares may differ in bytes, a wall-clock
    # timing figure keeping its series and points and a rounding-level figure its recorded values within their
    # rounding bounds. Provider tasks are listed as not re-executed (no provider is bound here), as are tasks whose
    # sources changed since the retained run.
    strategy:
      fail-fast: false
      matrix:
        core: [Haswell, Sandybridge]
    runs-on: ubuntu-latest
    env:
      OPENBLAS_CORETYPE: ${{ matrix.core }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,lab]"
      - name: Confirm the forced kernel
        run: python -c "from ciw.lab.blas_probe import openblas_core; import sys; core = openblas_core(); print(core); sys.exit(core != '${{ matrix.core }}')"
      - run: python -m pytest -q tests/test_lab_*.py
      - name: Re-execute every retained figure task on the forced kernel and compare
        run: python scripts/check_figures.py --retained lab --output-dir results/figures-${{ matrix.core }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: figure-check-${{ matrix.core }}
          path: |
            results/figures-${{ matrix.core }}/figure-check.json
            results/figures-${{ matrix.core }}/figure-check.md
            results/figures-${{ matrix.core }}/run/artifacts/**/*.svg
            results/figures-${{ matrix.core }}/run/reports/*.json
          if-no-files-found: warn

  plsr-terminal:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned optional instrument and run adapter tests
        run: |
          python -m pip install -e ".[dev,plsr]"
          python -m pytest -q tests/test_plsr.py tests/test_plsr_engine.py
      - name: Build and install the workbench wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip uninstall -y computational-instrumentation-workbench
          python -c "import pathlib, subprocess, sys; subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', str(next(pathlib.Path('dist').glob('*.whl')))], check=True)"
      - name: Exercise retained evidence and replay outside the checkout
        run: python scripts/check_plsr_installed.py

  installed-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build installable wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Install and exercise wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/ciw-installed"
          "$RUNNER_TEMP/ciw-installed/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/ciw-installed/bin/python" scripts/check_installed.py
      - uses: actions/upload-artifact@v4
        with:
          name: ciw-python-wheel
          path: dist/*.whl

  container-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Build, deploy, restart and verify persisted workspace
        run: python scripts/check_container.py

  native-windows-deployment:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up the local service environment
        shell: pwsh
        run: ./scripts/workbench.ps1 Setup -PythonExecutable (Get-Command python).Source
      - name: Verify owned-process start, stop and persisted restart
        shell: pwsh
        run: ./scripts/check_local.ps1

  godot-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download pinned Godot Standard
        run: |
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.5.2' --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.5.2-stable_linux.x86_64"
      - name: Import project and exercise both WebSocket clients
        run: python scripts/check_godot.py --godot "$RUNNER_TEMP/godot/Godot_v4.5.2-stable_linux.x86_64"
