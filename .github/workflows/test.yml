name: Prototype checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  installed-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build installable wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Install and exercise wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/ciw-installed"
          "$RUNNER_TEMP/ciw-installed/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/ciw-installed/bin/python" scripts/check_installed.py
      - uses: actions/upload-artifact@v4
        with:
          name: ciw-python-wheel
          path: dist/*.whl

  container-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Build, deploy, restart and verify persisted workspace
        run: python scripts/check_container.py

  godot-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download pinned Godot Standard
        run: |
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.5.2' --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.5.2-stable_linux.x86_64"
      - name: Import project and exercise both WebSocket clients
        run: python scripts/check_godot.py --godot "$RUNNER_TEMP/godot/Godot_v4.5.2-stable_linux.x86_64"
