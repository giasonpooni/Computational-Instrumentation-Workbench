name: Native variational free-energy bench

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  free-energy:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'setuptools>=77' wheel
      - run: python scripts/check_free_energy.py --output-dir results/free-energy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-energy-evidence-${{ matrix.os }}
          path: results/free-energy
          if-no-files-found: warn
