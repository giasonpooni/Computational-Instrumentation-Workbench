[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "computational-instrumentation-workbench"
version = "0.1.0"
description = "Terminal-first computational instruments with synchronized optional Godot views"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy==2.4.3", "websockets==16.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]
bench-models = ["jsonschema==4.26.0"]
mcp = ["mcp==2.2.0"]
lab = ["scipy==1.16.2", "sympy==1.14.0", "mpmath==1.3.0", "jsonschema==4.26.0", "pygeodesic==0.1.11",
       "potpourri3d==1.4.0"]
plsr = ["parameterized-lyapunov-stability-runtime @ git+https://github.com/giasonpooni/Parameterized-Lyapunov-Stability-Runtime.git@19ea6967060166ba09db6cd4563bd87bd6b3d196"]

[project.scripts]
ciw = "ciw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ciw = ["plsr-runtime.json", "adapter-runtimes.json", "exchange-runtime.json", "telemetry-runtimes.json", "calibrated-observable-runtimes.json", "identified-design-runtimes.json", "esm-runtime.json", "calibrated-window-runtimes.json"]
"ciw.lab" = ["queue.json", "task-report.schema.json", "julia/Project.toml", "julia/Manifest.toml",
             "julia/oscillator_worker.jl", "julia/julia-runtime.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["lab_task(*task_ids): the lab queue tasks that register this test as a regression test (read by T168)"]
